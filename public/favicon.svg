<?xml version="1.0" encoding="UTF-8"?>
<svg id="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" class="w-full h-full drop-shadow-md transition-transform duration-300 group-hover:scale-105">
